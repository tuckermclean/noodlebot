# noodlebot: implementation dependency graph (the graph regime; SPEC.md §2, §3).
# Each node has a spec at nodes/<id>-<name>.md. `deps` are hard dependencies. `track`: now = next up;
# later = after. Checked by plugin/skills/node/check-regime.py.
template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
nodes:
  - {id: D01, track: now, name: self-deploy, deps: [], summary: "The scheduler deploys its own repository: when main moves, it runs make test on the new commit in a scratch worktree, and only if that passes fast-forwards the live checkout and re-execs its loops between ticks, keeping running sessions; a failing commit is not deployed and is reported; the previous commit is kept for a rollback"}
  - {id: D02, track: now, name: runtime-dir, deps: [], summary: "The scheduler keeps its runtime folders (clones, worktrees, state) outside any repository checkout, under $NOODLEBOT_DATA (default ~/.local/share/noodlebot), so no session loads noodlebot's own CLAUDE.md or AGENTS.md; a one-time move-runtime.sh moves an existing installation while nothing runs and repairs its worktrees"}
  - {id: R01, track: now, name: shared-roles, deps: [], summary: "Generic tester, implementer and reviewer agents and a role guard in the plugin, so a repository under the regime needs no agents of its own; the guard holds each role to its paths, taken from the repository's own configuration"}
  - {id: L01, track: now, name: labels, deps: [], summary: "Each loop, when it starts, makes sure the labels it relies on (noodlebot, noodlebot-triaged, noodlebot-status) exist in its repository, creating only the missing ones with a colour and a description; a failure is logged and the loop carries on"}
  - {id: C01, track: later, name: cost-report, deps: [], summary: "Each session's cost and turns, from its stream-json result events, on the status issue while it runs and in the comment for its end"}
  - {id: M01, track: later, name: loops, deps: [], summary: "One command starts, stops and shows the loops for every repository on the machine's list, so adding a repository is one line"}
  - {id: A01, track: later, name: adopt-skill, deps: [R01], summary: "/noodlebot:adopt <owner/name> brings a repository without a graph into the regime: it drafts SPEC.md, docs/graph.yaml, node specs and an AGENTS.md Building-a-node section from the code, README, issues and the owner's answers, as one PR that check-regime passes"}
