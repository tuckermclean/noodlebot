# noodlebot: implementation dependency graph (the graph regime; SPEC.md §2, §3).
# Each node has a spec at nodes/<id>-<name>.md. `deps` are hard dependencies. `track`: now = next up;
# later = after. Checked by plugin/skills/node/check-regime.py.
template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
nodes:
  - {id: D01, track: now, name: self-deploy, deps: [], summary: "The scheduler deploys its own repository: when main moves, it runs make test on the new commit in a scratch worktree, and only if that passes fast-forwards the live checkout and re-execs its loops between ticks, keeping running sessions; a failing commit is not deployed and is reported; the previous commit is kept for a rollback"}
  - {id: D02, track: now, name: runtime-dir, deps: [], summary: "The scheduler keeps its runtime folders (clones, worktrees, state) outside any repository checkout, under $NOODLEBOT_DATA (default ~/.local/share/noodlebot), so no session loads noodlebot's own CLAUDE.md or AGENTS.md; a one-time move-runtime.sh moves an existing installation while nothing runs and repairs its worktrees"}
  - {id: D03, track: now, name: fast-tests, deps: [], summary: "make test runs in under three minutes on the scheduler's machine with no criterion's check lost: the test files wait for the condition they check instead of fixed sleeps, their fakes run fast, shared helpers replace copied code and overlapping cases are merged; a runner prints each file's time, flags files over budget, and CI fails a run over budget"}
  - {id: D04, track: now, name: deploy-runtime, deps: [D01, D03], summary: "The self-deploy tests only what the loop runs: a range of commits that changes no runtime path (only the specs, the graph, the docs and the CI workflows, a list kept in deploy.sh with the reason for each) is fast-forwarded without make test and without a loop re-exec; a make test that fails reruns its failed files once, alone, and a failure that does not repeat is deployed and logged as flaky instead of rejected; the last failing run's output is kept under deploy/ and deploy.log names its failed files"}
  - {id: D05, track: now, name: s07-waits, deps: [S07, D03], summary: "The start-queue tests (loop-s07*.test.sh) hold up on a loaded machine under the runner's parallelism: each check that failed under load is diagnosed from a recorded loaded run, and the cases wait for the turns, ticks and status-log lines they check instead of tight wall-clock windows, with no check loosened; recorded loaded runs pass"}
  - {id: R01, track: now, name: shared-roles, deps: [], summary: "Generic tester, implementer and reviewer agents and a role guard in the plugin, so a repository under the regime needs no agents of its own; the guard holds each role to its paths, taken from the repository's own configuration"}
  - {id: L01, track: now, name: labels, deps: [], summary: "Each loop, when it starts, makes sure the labels it relies on (noodlebot, noodlebot-triaged, noodlebot-status) exist in its repository, creating only the missing ones with a colour and a description; a failure is logged and the loop carries on"}
  - {id: C01, track: later, name: cost-report, deps: [], summary: "Each session's cost and turns, from its stream-json result events, on the status issue while it runs and in the comment for its end"}
  - {id: M01, track: later, name: loops, deps: [], summary: "One command starts, stops and shows the loops for every repository on the machine's list, so adding a repository is one line"}
  - {id: A01, track: later, name: adopt-skill, deps: [R01], summary: "/noodlebot:adopt <owner/name> brings a repository without a graph into the regime: it drafts SPEC.md, docs/graph.yaml, node specs and an AGENTS.md Building-a-node section from the code, README, issues and the owner's answers, as one PR that check-regime passes"}
  - {id: T01, track: now, name: throttle, deps: [], summary: "The plan's usage, read from every session's rate_limit_event lines (one account, one budget), holds new sessions while the 5-hour window is projected past its limit before the reset or the 7-day window runs ahead of an even pace; running sessions are never stopped; a session stopped by the usage limit uses up no start; the status issue and status.sh show both windows and the throttle"}
  - {id: S01, track: now, name: stop-closed, deps: [], summary: "A node session still running when its PR is merged or closed is stopped (its whole process group) within a tick and said once in the status log; a merged node's worktree is then archived and removed as usual, and a node whose PR was closed without merging is held by a FAILED naming that PR until the owner deletes it"}
  - {id: S02, track: now, name: bg-wait, deps: [T01], summary: "Sessions are not cut off while their own subagents or CI watches still run (run-session.sh sets CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS, default 0); a session the CLI still stops that way is recognised from its session.stderr, gives its start back as a limit exit does, is never taken for a finished triage, and is one status-log event"}
  - {id: S03, track: now, name: merged-followup, deps: [S01], summary: "An answered question (or a merged spec PR waited for) of a node whose PR is already merged starts a follow-up session on a new branch node/<ID>-followup-<n> from main, told that the node is merged and where the last run left its work; it is not stopped for the node's earlier merged PR, ends like any session, and the status issue says resumes within seconds only when ready.py would start the node, otherwise what the answer waits for"}
  - {id: S04, track: now, name: resume, deps: [T01], summary: "A node session that ended without a PR or a question (usage limit, stopped by hand, crash) is restarted as a resume: the loop records why it ended, saves any uncommitted changes as a patch and cleans the worktree, and the prompt tells the run to carry on from its brief, logs, commits and CI runs instead of starting fresh"}
  - {id: S06, track: now, name: limit-resume, deps: [T01, S04], summary: "A node, triage or update session left alive but idle by the usage limit (its log ends with the limit rejection) is stopped once that window reset more than 2 minutes ago and the throttle is open, and its conversation is resumed in a new process (claude -p --resume <session id>) with a prompt that says the limit stopped it and its background work was killed; it uses no start and is one status-log event, and a session with no session id, or whose resume does not start, ends as a limit exit and is restarted the usual way"}
  - {id: G01, track: now, name: spec-ids, deps: [], summary: "A new node's ID is free on main and in every open spec PR (triage's nodes.py reads their graphs and prints the next free ID per letter); a spec PR of the bot's own that conflicts with main is updated by an update session the loop starts, which merges main, renumbers its node if the ID is now taken, reruns the spec checker, pushes and says so on the PR"}
  - {id: U01, track: now, name: unit-issues, deps: [S03], summary: "Every unit (a triage, or a node while it is built) has one home issue (the triaged issue, the node's first Resolves issue, or a new Build issue): the loop posts only its milestones there, each led by a stage line, takes any owner comment after its open question as the answer without an ID prefix, and closes the issue itself once the nodes resolving it are merged and no question is open, so PR bodies say Refs, not a closing keyword"}
  - {id: U02, track: now, name: daily-log, deps: [U01], summary: "One log issue per local day (noodlebot log YYYY-MM-DD, labelled noodlebot-status) replaces the sticky status issue: its body is a status table edited each tick, its first comment is the morning overview (so it notifies), the rest of its comments are the day's events one line each, and at the first tick after midnight the loop posts a closing summary, closes it and opens the next day's with links both ways; the old status issue is closed with a link to it"}
  - {id: V01, track: now, name: version, deps: [D01], summary: "noodlebot reports its version, git describe --tags --always of the live checkout taken once per loop start (scheduler/version.sh): every comment and issue body report.py writes and every PR body and comment a session writes end with a signature linking that commit, commits made in sessions carry a Noodlebot-Version trailer, and the status log's start line, deploy events, the status issue header, status.sh and loops.sh status name it"}
  - {id: P01, track: now, name: api, deps: [M01], summary: "One read-only HTTP API per machine on the Unix socket $NOODLEBOT_DATA/api.sock (owner-only, standard library only, started and stopped with the loops by loops.sh) serves everything the loops know from their local state, for every listed repository: repositories, nodes and their states, sessions summarised from their logs, the throttle, open PRs, triage issues and deploys, plus the status logs as server-sent events with a since cursor, each resource under a versioned JSON schema checked in make test, and never a token"}
  - {id: P02, track: now, name: api-cli, deps: [P01], summary: "A command-line client of the API (scheduler/nbctl.py) shows every listed repository's scheduler, or one repository's in the detail status.sh gives, follows the event stream live and prints any resource as JSON, reading nothing but the socket"}
  - {id: P03, track: later, name: api-controls, deps: [P01], summary: "The owner's controls as API requests that only write a marker the loop already reads or a new one-shot marker the loop consumes (delete a node's or issue's FAILED, create or remove ~/STOP-<name>, release one throttle-held node once, retry a rejected deploy, request a rollback), each carried out and logged by the loop or deploy.sh at its next run; answers stay on GitHub, and the API links to the question's issue"}
  - {id: S07, track: now, name: start-queue, deps: [T01, S06], summary: "New sessions ease in, one at a time across every loop on the machine: a shared start record under $NOODLEBOT_DATA/state/ keeps a minimum gap between starts (default the slowest loop's tick), and when units compete for a start, triages, spec-PR updates, follow-ups and resumed units go before fresh nodes, fresh nodes go by their spec's Size (S, M, L), and the longest-waiting go first within each, unless a unit has waited past a starvation limit, which then goes first whatever its size; each start names its size, its wait and the units it went ahead of in the status log; running sessions are untouched"}
  - {id: W01, track: now, name: site-data, deps: [], summary: "scheduler/site.py build turns what the loops already keep locally (each public repository's graph, node specs and node states, pending spec-PR graphs, open PRs, triage issues, the throttle, recent status-log events, deploys) into a few compact JSON files under a key-by-key schema, publishing only whitelisted fields, with local paths and token-shaped strings removed from every text"}
  - {id: W02, track: now, name: site-publish, deps: [W01], summary: "Each loop's tick ends with a publish step: site.py publish rebuilds the status-site files and, only when a file's content hash changed (or a 15-minute keepalive is due) and at most once a minute across all loops, sends the changed files and a manifest to the owner's public gist in one PATCH, with the owner's gist-only token read per command and never logged; the gist is made by hand and never created"}
  - {id: W03, track: now, name: site-front, deps: [W02], summary: "A static front end under site/ (plain HTML, JS and CSS, no build step), deployed to GitHub Pages by a workflow only when site/ changes, polls the gist through api.github.com once a minute with If-None-Match, pauses while hidden, backs off on 403 and 429, shows the data's age, and has the throttle and activity views and a node table per repository"}
  - {id: W04, track: now, name: site-explorer, deps: [W03], summary: "The status site's node explorer per repository: a layered DAG (deps left to right) in track bands, nodes coloured by state, a click shows a node's summary, criteria, deps, unlocks, PR, issue, question and session, a selection highlights everything upstream and downstream, ready-next and the longest remaining chain are marked, open spec PRs' changes show as ghost nodes, and filters hide tracks and states"}
  - {id: W05, track: now, name: site-links, deps: [U02, W04], summary: "When the status site is set up (~/.config/noodlebot/site holds its https address, the loop publishes the site and the repository is public), what the bot writes on GitHub links to it: the log issue links the repository's page and the throttle, node IDs in the log issue, its overview, summaries and events link to the node in the explorer, each node's home issue and milestones link its node and each triage's its activity, and session prompts tell sessions to link nodes the same way in PR bodies and comments; a node link to a node not yet published says so on the site; without the setting every text is as before"}
  - {id: W06, track: now, name: site-design, deps: [W05], summary: "The status site gets a design pass with no new data, dependency or build step: one set of colour tokens in site/style.css with a light and a dark theme whose text meets WCAG AA contrast, one colour per node state shared by the explorer, the node table and the repositories view, a page shell with a header, the current route marked and a live or stale pill, repository cards with a bar of node states, throttle meters with reset countdowns and a gridded history chart, an activity timeline grouped by day with state badges, a brief mark on what changed since the last poll (off under reduced motion), a layout that works on a phone, and recorded screenshots"}
  - {id: T03, track: now, name: weekly-pace, deps: [T01, M01, D01], summary: "The throttle's 7-day pace hold is off unless USAGE_7D_PACE=1 (USAGE_7D_MARGIN still sets its margin when on); a 7-day window the plan has cut off still holds, the 7-day reading and its pace are still shown, loops.sh start passes its USAGE_* and SCHED_* settings to each loop so they reach the loops and survive a deploy's re-exec, and deploy.sh's make test runs without them"}
  - {id: G02, track: now, name: node-pr-update, deps: [G01, U01], summary: "A bot's node PR that conflicts with main gets an update session (/noodlebot:node --update <N>) the loop starts as it does for spec PRs: it merges main without changing a frozen test or fixture line or a spec file (it asks the owner instead), may add test lines only to keep appended test blocks apart, reruns make test and the node's red targets, has the resolution checked by a fresh reviewer before it pushes, and says on the PR what it resolved; every conflict resolution in both skills gets that review, and test blocks keep their scratch paths in their own folder"}
  - {id: G03, track: now, name: pr-feedback, deps: [G01, U01], summary: "The owner's conversation comments, line comments and reviews (other than approvals and a bare thumbs-up) on the bot's own open PRs are acted on: each tick the loop finds feedback newer than what it last acted on and starts one session for the PR's unit (a node session on a node or follow-up PR's branch, a triage session on a spec PR's branch), which fixes it under the usual rules or asks, replies to each point on the PR and resolves the line threads it fixed; feedback arriving while it runs starts the next one"}
  - {id: G04, track: now, name: forge, deps: [G02, G03], summary: "Core reaches the code forge only through a forge interface (scheduler/forge.py and its CLI): pull requests, reviews, issues, comments, labels, the repository's visibility and identities, clone and web URLs, site publishing and authenticated pushes, with credentials fetched per command; GitHub is its first backend, chosen by the loop's [<forge>:]<path> argument (owner/name still means GitHub), every core caller is converted, make test fails on a gh call or github.com URL in core code outside the backend, and one conformance suite passes against the GitHub backend and a fake forge"}
  - {id: S08, track: now, name: harness, deps: [P03], summary: "Core reaches the agent harness only through a harness interface (scheduler/harness.py): starting and resuming a session, how a prompt names a skill, and a normalised event log (session id, usage-limit readings, result with cost and turns, tool use, background cut-off) that loop.sh, usage.py, api.py, report.py and site.py read instead of Claude Code's stream-json; Claude Code is its first backend, chosen per loop (SCHED_HARNESS, default claude-code), a capability a backend lacks is turned off with one logged line, make test fails on a claude call or stream-json field in core code outside the backend, and one conformance suite passes against the Claude Code backend and a fake harness"}
  - {id: R02, track: now, name: neutral-plugin, deps: [G04, S08], summary: "The skills, agents and session templates reach the forge through the forge CLI and name no forge or harness, and plugin/ becomes neutral content plus a Claude Code adapter (its manifest, the hook wiring and the role guard's input format), checked in make test"}
  - {id: U03, track: now, name: queue-status, deps: [U02, S07], summary: "What the bot says about a unit while it waits is true whatever the throttle: in the tick that sees it, a newly labelled issue gets one queued milestone with the throttle's state and its place in the start queue, an answer is said to resume within seconds only when the throttle is open and it is first in the queue (otherwise what holds it and how many units are ahead), and a unit whose spec PR is merged stops showing as waiting for the owner's merge on the log issue, the site and status.sh"}
  - {id: S09, track: now, name: pickup-agent, deps: [U03, S08, G04], summary: "A small agent on the harness's small model (Haiku on Claude Code), run by the loop only when there are owner comments the deterministic code could not place, decides for each whether it answers a unit's question, is feedback on a bot PR or is a new request, and the loop carries out its decision (ANSWER.md, FEEDBACK.md, or a new unlabelled issue for the owner to label) and replies once to each; it has no tools and never commits, pushes, opens PRs or edits specs, runs through the pace hold but not past a window's hard limit or a usage ceiling, and has its own budget of runs per 5-hour window"}
