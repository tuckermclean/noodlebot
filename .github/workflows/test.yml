# make test on every pull request and on main: the scheduler's unit and end-to-end tests, with fake
# gh and claude, so no credential is needed.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools the tests use
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
      - name: make test
        run: make test
