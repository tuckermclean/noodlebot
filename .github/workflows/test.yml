# make test on every pull request and on main: the scheduler's unit and end-to-end tests, with fake
# gh and claude, so no credential is needed.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools the tests use
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
      # The two steps differ only in TEST_BUDGET_ENFORCE. On pull requests the time budgets fail the
      # run, so a slow test is caught in review. On push to main the TIME/SLOW/TOTAL lines are still
      # printed, but only a failing test fails the run: GitHub's runner times vary, and main's push
      # run gates the self-deploy (D07).
      # The budgets (D15) come from the record of every test.yml attempt of 2026-11-14..2026-11-18 (147
      # attempts) in D15's PR: slowest passing file 83.17 s x 1.2 rounded up to 15 s = 105; largest TOTAL
      # 529.92 s x 1.1 rounded up to 30 s = 600, which D10's fixture f12 excludes, so 630.
      - name: make test (pull_request)
        if: github.event_name == 'pull_request'
        run: make test
        env:
          SITE_TESTS: required
          TEST_BUDGET_ENFORCE: 1
          TEST_FILE_BUDGET: 105
          TEST_BUDGET: 630
      - name: make test (push)
        if: github.event_name == 'push'
        run: make test
        env:
          SITE_TESTS: required
          TEST_FILE_BUDGET: 105
          TEST_BUDGET: 630
