# One noodlebot scheduler: exactly one replica per runtime root (the claim below). No Service: the API is a Unix
# socket on the volume (kubectl exec ... nbctl). The Secret noodlebot-config is created by hand and is not here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: noodlebot
spec:
  # No Service by this name is made; some API versions require the field.
  serviceName: noodlebot
  replicas: 1
  selector:
    matchLabels:
      app: noodlebot
  template:
    metadata:
      labels:
        app: noodlebot
    spec:
      # Longer than loops.sh stop's 300 s wait.
      terminationGracePeriodSeconds: 330
      # User namespace for the pod: procMount Unmasked below needs it (Kubernetes with user namespace support).
      hostUsers: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      initContainers:
        # A new volume starts empty: ~/.config must exist and belong to noodlebot before the config Secret is
        # mounted below it (the mount would otherwise create it owned by root).
        - name: home-config
          image: ghcr.io/owner/name:latest
          command: [mkdir, -p, /home/noodlebot/.config]
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /home/noodlebot
      containers:
        - name: noodlebot
          image: ghcr.io/owner/name:latest
          securityContext:
            privileged: false
            # newuidmap and newgidmap are setuid: rootless podman nested in the pod needs them to work.
            allowPrivilegeEscalation: true
            appArmorProfile:
              type: Unconfined
            # Unmasks /proc, so nested podman can mount a /proc of its own; needs hostUsers: false above.
            procMount: Unmasked
          volumeMounts:
            - name: home
              mountPath: /home/noodlebot
            - name: config
              mountPath: /home/noodlebot/.config/noodlebot
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: noodlebot-config
            # r-x for owner and group: the files are group fsGroup (noodlebot's group), and the token script is run.
            defaultMode: 0550
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
