# Rootless podman nested in the noodlebot container (D06).
[containers]
# Docker and Kubernetes mask parts of /proc in the container, which stops a nested podman from mounting its own /proc;
# a bind of this container's /proc into each nested container avoids that mount (as quay.io/podman/stable does).
volumes = ["/proc:/proc"]
netns = "host"
utsns = "private"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
